services:
  # FlareSolverr for Cloudflare bypass (Dutchie protection)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: dispo-flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8191 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Scraper service - runs on schedule
  scraper:
    build: .
    container_name: dispo-scraper
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - LOG_LEVEL=INFO
      - TZ=America/New_York
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - dispo-data:/app/data
      - dispo-cache:/app/cache
      - ./config.yaml:/app/config.yaml:ro
      # Source is bind-mounted so code changes (dashboard.html, api_server.py,
      # scrapers/) take effect without rebuilding the image.
      - ./api_server.py:/app/api_server.py:ro
      - ./dashboard/dashboard.html:/app/dashboard/dashboard.html:ro
      - ./config.py:/app/config.py:ro
      - ./main.py:/app/main.py:ro
      - ./models.py:/app/models.py:ro
      - ./scrapers:/app/scrapers:ro
      - ./storage:/app/storage:ro
      - ./notifier:/app/notifier:ro
      - ./utils:/app/utils:ro
      - ./maintenance:/app/maintenance:ro
      - ./requirements.txt:/app/requirements.txt:ro
    depends_on:
      flaresolverr:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python main.py --once && python main.py"
    healthcheck:
      disable: true

  # API server for dashboard
  api:
    build: .
    container_name: dispo-api
    ports:
      - "4040:4040"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - dispo-data:/app/data
      - dispo-cache:/app/cache
      # config.yaml drives the logo lookup for /api/logo/<store_id>.
      - ./config.yaml:/app/config.yaml:ro
      - ./api_server.py:/app/api_server.py:ro
      - ./dashboard/dashboard.html:/app/dashboard/dashboard.html:ro
      - ./config.py:/app/config.py:ro
      - ./models.py:/app/models.py:ro
      - ./scrapers:/app/scrapers:ro
      - ./storage:/app/storage:ro
      - ./notifier:/app/notifier:ro
      - ./utils:/app/utils:ro
    restart: unless-stopped
    command: python api_server.py --port 4040
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4040/api/data || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Manual trigger service
  manual-scrape:
    build: .
    container_name: dispo-manual
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - LOG_LEVEL=INFO
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - dispo-data:/app/data
      - dispo-cache:/app/cache
      - ./config.yaml:/app/config.yaml:ro
      - ./api_server.py:/app/api_server.py:ro
      - ./dashboard/dashboard.html:/app/dashboard/dashboard.html:ro
      - ./config.py:/app/config.py:ro
      - ./main.py:/app/main.py:ro
      - ./models.py:/app/models.py:ro
      - ./scrapers:/app/scrapers:ro
      - ./storage:/app/storage:ro
      - ./notifier:/app/notifier:ro
      - ./utils:/app/utils:ro
    depends_on:
      flaresolverr:
        condition: service_healthy
    profiles:
      - manual
    command: python main.py --once

volumes:
  dispo-data:
  dispo-cache:

networks:
  default:
    name: dispo-network