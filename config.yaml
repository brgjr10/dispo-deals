scrapers:
  dutchie:
    graphql_endpoint: https://api.dutchie.com/graphql
    timeout: 30
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      Accept: application/json
      Content-Type: application/json
  klutch:
    timeout: 30
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  magento:
    timeout: 30
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      Accept: application/json
      Content-Type: application/json
  woocommerce:
    timeout: 30
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      Accept: application/json
images:
  cache_dir: ./cache/images
  max_width: 800
  max_size_kb: 500
  formats:
  - jpg
  - jpeg
  - png
  - webp
deduplication:
  hash_fields:
  - store_id
  - product_id
  - sale_price
  - discount_pct
  re_notify_on_deeper_discount: true
weekly_menu:
  snapshot_day: 0
  min_items_for_snapshot: 10
  enabled: true
  send_day: 0
  require_previous_week: true
webhook:
  max_retries: 3
  backoff_base_seconds: 5
  timeout: 15
leafly:
  enabled: true
  search_endpoint: https://consumer-api.leafly.com/api/search/v1
  site_url: https://www.leafly.com
  timeout: 15
  max_retries: 3
  request_delay_seconds: 0.4
  categories:
  - Flower
  - Pre-Rolls
  - Concentrate
  - Vaporizers
  match_threshold: 0.6
  cache_days: 30
