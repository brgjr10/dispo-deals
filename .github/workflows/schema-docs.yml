name: Schema Documentation

on:
  push:
    paths:
      - 'storage/sqlite.py'
      - 'models.py'
      - 'utils/generate_schema.py'
  pull_request:
    paths:
      - 'storage/sqlite.py'
      - 'models.py'
      - 'utils/generate_schema.py'

jobs:
  generate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate schema documentation
        run: |
          mkdir -p data
          # Use the actual storage module to initialize the database
          python -c "
import sys
sys.path.insert(0, '.')
from storage.sqlite import SQLiteStorage
# This will create the database with the current schema
storage = SQLiteStorage('./data/dispo_deals.db')
print('Database initialized with current schema')
          "
          python -m utils.generate_schema > docs/schema.md

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain docs/schema.md)" ]; then
            echo "Schema documentation has changed. Please commit the updated docs/schema.md"
            git diff docs/schema.md
            exit 1
          else
            echo "Schema documentation is up to date"
          fi